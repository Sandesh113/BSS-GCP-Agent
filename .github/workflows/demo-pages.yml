name: Publish narrated demo

on:
  push:
    branches: [main]
    paths:
      - demo/catalogue-to-network.html
      - demo/audio/**
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare demo site
        run: |
          mkdir -p _site
          cp demo/catalogue-to-network.html _site/index.html
          cp -R demo/audio _site/audio
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
